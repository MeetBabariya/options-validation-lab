name: daily-snapshot

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC, the Deribit expiry/settlement time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/snapshot.py ETH
      - run: python scripts/build_surface.py BTC   # snapshots BTC, refits the surface, redraws the plot
      - name: Commit snapshot
        run: |
          git config user.name "Meet Babariya"
          git config user.email "160588987+MeetBabariya@users.noreply.github.com"
          git add data/snapshots reports
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%Y-%m-%d)"
          git push
